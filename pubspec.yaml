name: ats_technician_mobile
description: App Android para técnicos de servicio de ATS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.1.2
  shared_preferences: ^2.0.15
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.3
  image_picker: 1.1.2
  path_provider: 2.1.5
  geolocator: 13.0.2
  flutter_background_service: 5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ats-logo.png
